# docker compose up --build   ->  API on :8000, UI on :8501, Qdrant on :6333
# The API and UI share one Qdrant server (embedded Qdrant would lock its folder to one process).
services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  api:
    build: .
    env_file: [.env]
    environment:
      QDRANT_URL: http://qdrant:6333
    ports: ["8000:8000"]
    volumes: [./data:/app/data, ./outputs:/app/outputs, ./logs:/app/logs]
    depends_on: [qdrant]

  ui:
    build: .
    command: ["streamlit", "run", "ui/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    env_file: [.env]
    environment:
      QDRANT_URL: http://qdrant:6333
    ports: ["8501:8501"]
    volumes: [./data:/app/data, ./outputs:/app/outputs, ./logs:/app/logs, ./eval:/app/eval]
    depends_on: [qdrant]

volumes:
  qdrant_data:
