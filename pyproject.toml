[project]
name = "rfp-intelligence"
version = "0.1.0"
description = "RFP Intelligence Platform: hybrid RAG search engine + multi-agent bid extraction"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "beautifulsoup4>=4.12",
    "python-docx>=1.1",
    "qdrant-client>=1.12",
    "fastembed>=0.5",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "openai>=1.40",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "ingestion*", "search*", "agents*", "api*", "eval*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: downloads embedding models / runs the full index"]
